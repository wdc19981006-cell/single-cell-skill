species: human
sample_column: sample

cell_qc:
  nFeature_min: 200
  nFeature_max: 4000
  nCount_min: 500
  nCount_max: 30000
  pMT_max: 25
  pHB_max: 1
  pRP_max: 100

doublet:
  enabled: true
  min_cells: 100
  max_pcs: 50
  pc_cumulative_variance: 90
  pc_individual_variance: 5
  pc_elbow_drop: 0.1
  clustering_resolution: 1
  pN: 0.25
  expected_rate: 0.04
  homotypic_adjustment: true
  final_filter: DF_adj
  regress:
    - pMT

cell_cycle:
  enabled: true
  score_only: true
  set_ident: false
  regression: none

plots:
  save_before_qc: true
  save_after_qc: true
  save_doublet_umap: true
  save_doublet_vlnplot: true
  save_cell_cycle_phase: true
  save_cell_cycle_score: true
